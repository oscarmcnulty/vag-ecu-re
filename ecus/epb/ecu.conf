# Audi B8/8R Electronic Parking Brake (EPB) control module -- "Parkbremse" J540, VCDS addr 53.
# Part 8K0907801N, SW 0005, component "EPB_D4" on the MLB powertrain/comfort CAN. This is the
# ACTUATOR ENDPOINT that clamps the rear calipers -- the module that receives external EPB
# close/open requests (from ESP and ACC) and drives the two caliper motors. Distinct from the
# ESP (ecus/esp8) and the engine (ecus/simos85) which only *request* EPB over CAN.
#
# GOAL (see docs/RE_findings.md): map the CAN RX, confirm which messages set/unset the EPB, and
# determine whether the clamp can be *partially* applied (modulated clamp force) for a low-speed
# ACC stop-and-go "hold" -- i.e. is EPB_Spannkraft a settable target or a fixed full-clamp.
# Topology from the bus side already known: EPB subscribes to ACC_05.ACC_Betaetigung_EPB (0x10D)
# and ESP_05.ESP_Anforderung_EPB (0x106); it TX's EPB_01 (0x104: Status, Spannkraft, Schalter).
# See memory [[vw-mlb-checksums]], [[mlb-stopgo-donor]], [[openpilot-integration-goal]].
#
# Image = FRF FL_8K0907801N_0005.frf, decrypted with VW_Flash frf.decryptfrf (recursive-XOR, not
# AES) -> .odx, then core/odx/odx_extract.py. PLAINTEXT (build strings "May 19 2010", version
# "8K0907801N ;X10;BL01BL02BL03X004", "AUDI_B8_0005" all readable -- no XOR/scramble on the app).
# Four UDS blocks by logical id (SOURCE-START-ADDRESS in the ODX is the block id 1..4, NOT a
# physical address -- the memory map is inferred from the code):
#   DB_4 (id 1) 114688 B = 7 x 16KB app flash pages   <- main ASW (build/version strings, code)
#   DB_6 (id 2)  98304 B = 6 x 16KB app flash pages   <- ASW continued / maps
#   DB_8 (id 3)  16384 B = 1 x 16KB page, ~empty (0x3F fill + "AUDI_B8_0005")  <- coding/CAL
#   DB_2 (id 4)   1280 B  <- driver/EEPROM defaults
#
# ARCH: Freescale/NXP HCS12X (S12X), BIG-ENDIAN, 16-bit core with 16KB PPAGE banking.
# Established empirically (ecus/epb/ghidra_scripts/ArchProbe.java): under HCS-12X:BE:24 the code
# decodes to coherent S12X -- RMW peripheral init (LDAB/ANDB/ORAB/STAB on 0x00xx regs), banked
# `CALL addr,page` with sane page bytes, real PSH/stack-frame prologues, const-init tables to
# consecutive RAM. M16C/V850/MCS96 all decode to semantic garbage. The reset/IRQ vector table
# (S12X local 0xFF80-0xFFFF, page 0x3F) is 0x3F-fill in these blocks -> it lives in the PROTECTED
# BOOTLOADER, which the app FRF does not reflash. So no reset vector here; entry via CAN/UDS
# handlers reached through the boot page's dispatch.

ECU_NAME=EPB_8K0907801N
LANG=HCS-12X:BE:24:default
# Flat-load the two app blocks for register/constant analysis (MSCAN + CAN-id absolute refs are
# page-independent). Proper PPAGE mapping is a later refinement for cross-page CALL resolution.
BLOCK_ASW1=firmware/DB_4_01.bin
BLOCK_ASW2=firmware/DB_6_02.bin
BLOCK_CAL=firmware/DB_8_03.bin
BLOCK_DRV=firmware/DB_2_04.bin

# ---- S12X PAGE MAP (confirmed by CAN-table anchor + cross-page CALL resolution) ----
# The two app blocks are contiguous banked 16KB flash pages (PPAGE window 0x8000-0xBFFF):
#   DB_4 = PPAGE 0xE0..0xE6  -> combined(cat DB_4 DB_6) offset = (P-0xE0)*0x4000
#   DB_6 = PPAGE 0xF8..0xFD  -> combined offset = 0x1c000 + (P-0xF8)*0x4000
# Fixed low page (local 0x4000-0x7FFF) = PPAGE 0xFD @ combined 0x30000 (holds the CAN RX matrix).
# Fixed high page (local 0xC000-0xFFFF, PPAGE 0xFF, reset+IRQ vectors) = PROTECTED BOOTLOADER, absent.
# Resolve a windowed ref: combined = (page-0xE0)*0x4000 [DB_4] or 0x1c000+(page-0xF8)*0x4000 [DB_6],
#   plus (local_addr - 0x8000). Verified: CALL 0xaa5c,0xe2 -> 0x0aa5c ; CALL 0x8846,0xf9 -> 0x20846.
# Absolute refs to 0x0000-0x03FF = registers (MSCAN 0x140-0x17F, PWM 0x300-0x327, CRG 0x34-0x3A),
#   0x0400-0x2FFF = RAM (CAN RX buffers 0x10a0-0x115e, decoded signal image ~0x2800). Page-independent.
