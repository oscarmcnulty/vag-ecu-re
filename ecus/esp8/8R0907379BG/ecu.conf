# ESP8 (Bosch, B8 Q5 8R0907379BG) reproduce config. Mixed ARM+Thumb + a data region, so this
# pack uses its OWN reproduce.sh (not the generic uniform-ISA core/pipeline/reproduce.sh):
# it recreates the exact function set from a Thumb-annotated manifest. See variant.conf for
# the firmware-verified arch facts.
ECU_NAME=ESP8
FIRMWARE=firmware/8R0907379BG_0030.bin
PROCESSOR=ARM:BE:32:v5t
LOADBASE=0x0
IMAGE_HI=0x134011
CODE_HI=0xa2000        # CODE 0x0-0xa2000 exec ; DATA 0xa2000+ non-exec (EspSplit)
RAM_BASE=0x400000
RAM_LEN=0x80000
# CODE_HI=0xa2000 bounds only the MAIN segment (+ ClaimOrphanCode). A SECOND code region
# (~file 0xbb045-0x106000, mixed ARM+Thumb, the AUTOSAR-COM deserialization stack) sits above it
# and is brought in by EspSeg2.java (reproduce.sh step 04b), loaded at VMA = file_offset + 3.
# See docs/second_code_segment.md + decode/second_code_segment.py.
SEG2_START=0xbb045
