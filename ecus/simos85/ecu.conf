# Simos 8.5 (Continental, Audi Q5 3.0 TFSI 8R0907551F) -- config for core/pipeline/reproduce.sh
# See README.md for the memory map and how the cal region / base registers were established.

ECU_NAME=Simos85
FIRMWARE=firmware/8R0907551F_Original.bin
LOADBASE=0x80000000
IMAGE_HI=0x80200000                       # Infineon TC1796, 2 MB OBD read
# EXPECT_SHA=                             # optional: set to verify the image before running

# Base registers, recovered with FindBaseRegs.java. a1 IS the calibration base on this ECU
# (unlike MED17): setting it folds [a1+off] cal reads to absolute DAT_8004xxxx, which took
# resolved cal references from 23 -> 840. Use the CACHED (0x8...) form so refs land in the
# image rather than the 0xa0000000 alias, which is not mapped here.
BASEREGS=(a0=0xd0008000 a1=0x80048000 a8=0x80088800)

# Code regions to sweep for orphan (disassembled, function-less) code. Two ranges because the
# calibration window sits INSIDE the code span on this image, unlike MED17 where cal is a
# contiguous block at the top. 0x80000000-0x80020000 is the bootloader, blank in an OBD read.
CODE_RANGES=(0x80020000:0x80040000 0x80080000:0x80200000)

CAL_LO=0x80040000
CAL_HI=0x80080000

# The canonical, hand-edited source of truth for calibration objects; step 5b projects it
# into Ghidra labels via core/maps/a2l_to_symbols.py.
A2L=maps/simos85.a2l

# Continental map-lookup framework (kl_interp_u16 / kf_interp_u16 + descriptor dispatch).
TRACE_MAP_CALLS=maps/map_calls.csv

# NOTE: no MEMMAP here yet. MED17 showed that leaving the non-cached 0xa0000000 flash alias
# unmapped truncates any body that dispatches through an alias pointer. Whether this image
# does that is unverified -- see analysis/coverage.log before adding an alias block.
