# Bosch ESP8 "quattro" -- Audi B8 Q5 8R (OUR car).  Facts here are firmware-verified.
PART_SW=8R0907379BG          # HW 8R0907379AM, H09 0030
COMPONENT="ESP8 quattro"
BOSCH_PROJECT=Bosch.CSDE.BEG_VAG.01.004
SUPPLIER_STRING=Bosch.CSDE.BEG_VAG.01.004
IMAGE=firmware/8R0907379BG_0030.bin
IMAGE_SIZE=0x134011
SOURCE="8R0907379BG_0030.sgo -- SGML container, whole image XOR 0xFF, 0x200 header stripped"
PROCESSOR=ARM:BE:32:v4t      # ARM7TDMI = ARMv4T + Thumb (refined from v5t 2026-10-05; see note below)
# MCU (firmware-fingerprinted 2026-10-05; die is bare/decapped/UNMARKED, so this is inference, HIGH conf):
#   TI TMS470-family ARM7TDMI core (ARMv4T, big-endian 32), Bosch-custom ESC derivative.
#   Evidence: ERCOSEK "V4.1.17k TMS_470 (c)ETAS Jul 12 2006" build string @file 0xa4d5b; CAN = TI
#   HECC/eCAN cells @0xFFF7E400 (A) / 0xFFF7E600 (B), 16-byte mailboxes, CANTA@+0x10/CANRMP@+0x18/
#   CANRML@+0x1C bit-per-object (NOT FlexCAN/D_CAN); TI "peripheral frame" map @0xFFF7xxxx (0x200
#   stride; ESC valve banks @0xFFF7D4xx, pump @0xFFF7F0A0); core is ARM7TDMI not ARM9 (pervasive BX
#   interwork veneers = no BLX; zero CP15/cache/MMU code). Reset vector @0x0 is a self-loop -> ASW is
#   entered BY SBOOT. Exact stock part# unrecoverable (custom peripheral mix). See SECURITY_ACCESS.md.
LOADBASE=0x0
RAMBASE=0x400000
CODE_RANGE=0x0:0xa2000       # VERIFIED (RE_findings.md); ARM and Thumb interleaved with data
DATA_RANGE=0xa2000:0x134011
# TWO independently signed segments -- ASW and dataset are separate signing units here.
SIGNATURE_BLOCKS=0xb7f2c:0xbd424,0x133bf5:0x61b28   # offset:declared_len
SIGNATURE_MAGIC=0x81820154
ACC_STOPGO=no                # 15.0 km/h ECD floor, hardcoded `cmp #0x78` (docs/ECD_path.md)
