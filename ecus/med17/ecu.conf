# MED17.1.1 (Bosch, Audi Q5 2.0 TFSI 8R0907115N) -- config for core/pipeline/reproduce.sh
# See README.md for how each of these was established (none is guessed).

ECU_NAME=MED1711
FIRMWARE=firmware/8R0907115N_0006.bin
LOADBASE=0x80000000
IMAGE_HI=0x80400000                       # Infineon TC1797, flat 4 MB PFLASH
EXPECT_SHA=3f95531a0537cadd261e8d390f9e3c27dc26f1baa0ccfbdc94ff5566a086c4fe

# Non-cached alias of PFLASH + RAM/peripheral space. Without these, flows into 0xa0...
# die as "Could not follow disassembly flow into non-existing memory" and truncate bodies.
ALIAS_BASE=0xa0000000
ALIAS_LEN=0x400000
MEMMAP=(--alias=$ALIAS_BASE:$LOADBASE:$ALIAS_LEN
        --alias=0xc00003a0:0x80020098:0x00001060
        --alias=0xc0001400:0x800045c0:0x00000080
        --alias=0xc0001480:0x80021178:0x00000080
        --alias=0xc0001500:0x80004640:0x00000248
        --uninit=0xc0000000:0x000003a0:PSPR_data:rw
        --uninit=0xc0001748:0x000068b8:PSPR_bss:rwx
        --uninit=0xd0000000:0x00100000:RAM:rw
        --uninit=0xd4000000:0x00010000:PRAM:rw
        --uninit=0xf0000000:0x10000000:CSFR:rwv)
# The 0xc0.. entries materialise a BOOT-COPIED CODE IMAGE. This dump is an OBD read with a blank
# boot sector (0x80000000..0x80004000 is all zero), so the crt0 that copies .data and relocates the
# scratchpad code is NOT in the image -- which also means emulating the boot cannot recover it. The
# copy TABLES are present and self-validating though (see symbols_merged.csv 0x800402bc / 0x8000e868),
# so we apply the one that matters directly, as a byte-mapped alias rather than a copy: the bytes
# stay the flash bytes, so the view cannot drift.
#   0xc00003a0 <- flash 0x80020098 len 0x12d0 is the PSPR-resident fixed-point math/helper library.
# It is carved into FOUR aliases, not one, because BOTH copy tables write segment 0xC and they overlap:
# table A separately copies 0x800045c0 -> 0xc0001400 (0x80) and 0x80004640 -> 0xc0001500 (0x248), which
# land INSIDE table B's 0xc00003a0..0xc0001670 range. A single flat alias would therefore show table B's
# flash bytes at two windows where the running ECU actually holds table A's. Table A is applied second,
# so it wins; the carve reproduces that. (Every PSPR entry point actually called from flash lies below
# 0xc0001400, so the distinction does not change which functions are recovered -- it is correctness for
# its own sake, and it keeps the two 0xc00014xx/0xc00015xx code blocks readable.) Note table A's second
# record runs to 0xc0001748, past table B's 0xc0001670 code end, so bss starts at 0xc0001748.
# Segment 0xC is the CPU-LOCAL PROGRAM SCRATCHPAD (PMI), proven from the image's own MPU region table
# @0x8003fa60: it splits segment 0xC into data c0000000-c000039f (0x3a0 total) then code
# c00003a0-c0007fff -- and the code copy lands exactly on that boundary. The bss bound is likewise
# taken from the table's own FILL record (0xc0001670 len 0x6990, ending exactly at 0xc0008000 = 32 KB).
# WHY THIS MATTERS: without it, ~1900 `calla` sites and 5 `ja` sites branch into unmapped memory.
# Ghidra reports unmapped memory with the same "Bad instruction" text that DecompileAll keys on, which
# is why 5 flash functions were long mis-recorded as `truncated:bad-instruction` -- there was never an
# unmodelled opcode (0x9d = JA, 0xed = CALLA, both TriCore format B).
# DELIBERATELY NOT MAPPED HERE:
#   - .data into DSPR (0xd0000ac8 etc). Initialised RAM lets the decompiler CONSTANT-FOLD reads, which
#     is right for const pointer tables and badly wrong for mutable globals -- a variable the firmware
#     writes at runtime would decompile as its power-on value. If you ever apply it, the DSPR block
#     must be marked volatile (flag `v`, as CSFR is) to suppress folding. Use core/ghidra/ApplyLoadImage.java
#     against a THROWAWAY copy, never the pipeline project.
#   - PCP2 images (0xf0050000 PRAM, 0xf0060000 CMEM <- flash 0x800222e8 len 0x2ca8). That is a second
#     processor's microcode in a different instruction set; Ghidra's TriCore model cannot decode it, so
#     mapping the destination buys nothing. It stays a known, bounded slice of the byte gap.

# Recovered by step 2 (FindBaseRegs) at the startup init @0x800829d2. Each occurs exactly
# twice -- set once at startup, never reloaded, which is what makes them base registers.
# NOTE vs Simos8.5: a1 points at a ROM constant pool INSIDE the code region, NOT at the cal
# area. MED17 addresses calibration ABSOLUTELY (movh.a + lea), so a1 is not a "cal base" here.
BASEREGS=(a0=0xd000c420 a1=0x8002f298 a8=0xd000c420 a9=0x80103464)
# a9 recovered by boot emulation (research/emulation/EmulA9.java) 2026-07-26, NOT by FindBaseRegs:
# a9 is the running task's data base, loaded per-context by FUN_8009624e from the OS table
# (a9 = *(0xd0014c7c + core*4)). For the application context it = 0xa0103464 = the uncached-flash
# alias of the CAL-OBJECT TABLE @0x80103464 (see maps/RESULTS.md #1). So the ACC code indexes the
# cal-object table: *(a9+off) = the cal object at table-index off/4. Cached form 0x80103464 used here
# so folded refs land in the 0x80000000 image. Unlocks all ACC calibration -> maps/a9_resolution.md.

# COM signal-descriptor table (step 6b, core/ghidra/DecodeComBindings.java). The generated COM
# stack binds signals to RAM in DATA -- the unpack routines store through a pointer read from a
# descriptor record -- so Ghidra sees the ACC status/state globals as unwritten. Records are
# found by content, not by assuming a stride.
# SIGNATURE = callback (+0x0c) + mask (+0x14). The context at +0x10 varies per message group
# (0xd000ad2a, 0xd000aae4, 0x00000000, ...); keying on it enumerates ONE group and misses half
# the table incl. every TX binding (278 records instead of 560) -- so it is output, not filter.
# Established on this image: 560 records, 40-byte stride, self-check 99.5% (start_bit+bit_len<=64).
# Confirmed both directions: RX d000a590 <- ACC_01 bit 60 len 3 = ACC_Status_ACC, and
# TX d000ab01 -> bit 62 len 2 = TSK_04.TSK_Status_GRA_ACC_02 (+ bit 16 len 2 = TSK_02.TSK_Status,
# which is why both status signals move in lockstep in the on-car log).
COM_DESC_CB=0x800286c6
COM_DESC_MASK=0x0000ffff

# CAN message table -- the ID -> signal -> RAM binding the descriptor scan alone cannot give.
# 48 records, stride 0x30: +0x00 = pointer to the message's signal block (0 if none),
# +0x04 = 11-bit CAN identifier, +0x08 = shared callback (0x80029652 on every record).
# Signal block: stride 0x0c, +0x00 points at DESCRIPTOR+0x18 (the target field, NOT the record
# start); the block runs until the next block begins. Decoded by core/maps/decode_can_table.py
# -> 44 messages / 274 signals. Reproduces both independently-established bindings: ACC_01
# d000a590 sb=60 len=3, and d000ab01 bound BOTH as TSK_02 sb=16 len=2 and TSK_04 sb=62 len=2
# (one byte, two projections -- why those two status signals move in lockstep on-car).
# Absence from this table is a reliable negative: 0x113 and 0x102 are not handled here.
CAN_MSG_TABLE=0x800312d0:0x80031bd0

# Step 10b. Yield on this image is modest and that is a property of MED17, not a misconfiguration:
# 474 computed sites -> 34 targets, nearly all const-ptr switch trampolines whose target is a few
# bytes past the site (intra-function), not cross-function dispatch. The 305 unresolved `calli`
# here read their pointer from a RAM table filled at boot (see FUN_8001e2c0 / 0xd0004980), which
# SymbolicPropogator cannot fold by construction. Kept enabled because the edges it does find are
# real and free; use step 4d + AuditIndirectBranches for the part it cannot reach.
RESOLVE_DISPATCH=analysis/dispatch_resolved.csv

# Flash source ranges of the boot copy tables (see symbols_merged.csv 0x800402bc / 0x8000e868).
# Step 4e must EXCLUDE these by range, not by score: a copied block encodes its calls relative to its
# RUNTIME address, so decoded at its flash address it scores 3-17% known-call ratio -- statistically
# indistinguishable from data -- and one of these ranges is PCP2 microcode in another instruction set
# entirely. Range exclusion is the only correct guard.
LOAD_IMAGE_RANGES=(0x800045c0:0x8000e868 0x80020098:0x80027298)

# Everything below the cal window is program code (the cal region is contiguous at the top).
CODE_RANGES=(0x80000000:0x80380000)

# Located by core/maps/find_cal_region.py (axis-array density: cal blocks score 735-2282
# against a median of 115 for code), corroborated by the software-ID strings at 0x803defa0.
CAL_LO=0x80380000
CAL_HI=0x80400000

# The cal-object table at 0x80103464 (reached via a9, see above) is this ECU's map-lookup
# framework. There is no full OEM-style label set: maps/med17_openpilot_lowspeed.a2l covers
# only the ACC low-speed cells under study, so it is deliberately NOT declared as A2L= here
# -- wiring a partial label set into the pipeline would imply coverage the pack does not have.
