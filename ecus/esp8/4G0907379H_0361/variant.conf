# Bosch "ESP Premium" -- Audi C7 A6/A7 (4G).  THE ACC-relevant image: one binary flashes both
# the non-ACC part (H) and the ACC part (J, pairs with hydraulic block 4G0614517S), so ACC vs
# non-ACC is a coding/variant split INSIDE this image.
PART_SW=4G0907379H
PART_SW_ALT=4G0907379J       # ACC variant -- same binary
COMPONENT="EV_ESPPremiAU57X"
BOSCH_PROJECT=BOSCH.CSDE.AUDI_B6.01.005
IMAGE=firmware/4G0907379H_0361.bin
IMAGE_SIZE=0x1e8000
SOURCE="FL_4G0907379H__0361.frf -> ODX-F -> DB_1DATA (UDS block id 0x10), plaintext, no XOR"
ODX_DATE=2011-09-02
PROCESSOR=ARM:BE:32:v5t
LOADBASE=0x18000             # VERIFIED (corrected 2026-08-20, was assumed 0): the IRQ vector
                             # chain resolves an interrupt handler-table pointer of 0x179eb4, whose
                             # 24 entries are all valid code ONLY under this base (0-3/24 under
                             # base 0). Same interrupt controller as the ESP9 (source byte at
                             # 0xFFFFFE03). NOTE: addresses = file offset + 0x18000.
RAMBASE=0x8000000            # VERIFIED from literal-pool addresses (the Q5 uses 0x400000)
CODE_RANGE=0x8000:0xe4000    # APPROX (16 KB-granular entropy/opcode profile), contiguous ARM
DATA_RANGE=0xe8000:0x181000  # APPROX; + a small island 0x1cd270:0x1cd6e0
PAD_FILL=0xb6
SIGNATURE_BLOCKS=0x1e7ef0:0x175b38
SIGNATURE_MAGIC=0x84000060   # differs from the Q5's 0x81820154
ACC_STOPGO=yes               # C7 ACC is 0-250 km/h stop&go; the ECD gate itself is NOT yet located
