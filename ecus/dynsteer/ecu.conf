# Audi B8 EPS -- ZF Lenksysteme "Servolectric" steering control unit (SCU_B8), part
# 8K0907144L, SW 0720, build 2013-01-02. Image extracted from a standalone .sgo with
# ecus/eps/extract_sgo.py (XOR-0xFF, strip the 0x200 header). See README.md + docs/.
#
# ARCH: Renesas/NEC V850 (V850E), little-endian, load base 0x00000000. ESTABLISHED from
# the image, not guessed:
#   - a little-endian data-pointer table decodes cleanly to flash addrs 0x000xxxxx AND
#     RAM addrs 0x03FFxxxx -- the textbook V850 on-chip RAM/peripheral window, and exactly
#     the 0x03FF0000 the ECU's own K-Line debug monitor writes to ('wr 0x03FF0000 ...').
#   - disassembly shows V850-only opcodes: callt, switch, 3-operand movhi split-immediates,
#     sld/sst [ep], satadd/satsubr/mulh (motor-control DSP). 0 invalid over long runs.
# Contrast: the ESP8 ABS (ecus/esp8) shares the .sgo CONTAINER but is ARM/BE32, and the
# engine ECUs here are TriCore -- the container says nothing about the core.

ECU_NAME=DynSteer_8K0907144L
FIRMWARE=firmware/8K0907144L_0720.bin
LOADBASE=0x0
PROCESSOR=V850:LE:32:default
IMAGE_HI=0x75000

# On-chip RAM + peripheral windows so data/SFR refs resolve (V850E layout, corroborated by
# the pointer table above). The fixed SFR area lives at the very top of the 32-bit space.
MEMMAP=(--uninit=0x03ff0000:0x00010000:IRAM:rw
        --uninit=0x03fec000:0x00004000:PPA_IO:rwv
        --uninit=0xfffff000:0x00001000:SFR:rwv)

# Code below the cal window; cal/data (maps incl. the HCA/LKAS torque limits, the fault
# table, and the KFC_* + state-machine string tables) sits at the top. Entropy drops at
# ~0x50000; the ASCII string tables begin ~0x4d000, so code is [0, 0x50000).
CODE_RANGES=(0x00000000:0x00050000)
CAL_LO=0x00050000
CAL_HI=0x00075000

# Indirect-call jumptable resolution (step 10b) -> analysis/dispatch_resolved.csv (gitignored).
RESOLVE_DISPATCH=analysis/dispatch_resolved.csv
