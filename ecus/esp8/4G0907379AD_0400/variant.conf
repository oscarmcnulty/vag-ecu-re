# Bosch ESP9 -- Audi C7 facelift (4G).  DIFFERENT GENERATION: this is the successor of our
# BEG_VAG.01 line (BEG_VAG.02), and it is Thumb-dominant, not ARM. Kept for architecture
# reference / MLB-evo lineage, NOT as a diff partner for the Q5.
PART_SW=4G0907379AD
COMPONENT="EV_ESP9BOSCHAU57X"
BOSCH_PROJECT=Bosch.CSDE.BEG_VAG.02.002
IMAGE=firmware/4G0907379AD_0400.bin
IMAGE_SIZE=0x1e8000
SOURCE="FL_4G0907379AD_0400.frf -> ODX-F -> DB_1DATA (UDS block id 0x10), plaintext"
PROCESSOR=ARM:BE:32:v7       # VERIFIED: 3357 MOVW/MOVT (ARMv6T2+) vs 30 in the Q5; the classic ARM
                             # exception-vector table at the image start rules out Cortex-M.
                             # Mostly Thumb-2 with an ARM outer layer (vectors, IRQ entry).
LOADBASE=0x18000             # VERIFIED, not 0: the IRQ handler table at addr 0x133ff8 resolves
                             # 24/24 entries to code only under this base, and the header at
                             # file+0x20 names 0x1ffee0/0x1ffef0 = the padding end / signature
                             # (file 0x1e7ee0/0x1e7ef0), pinning base = 0x200000-0x1e8000.
RAMBASE=0x8000000            # VERIFIED from literal-pool addresses (~128 KB used)
CODE_RANGE=0x1a000:0x147000  # plaintext region; all 3310 recovered functions fall inside it
ENCRYPTED_RANGE=0x147000:0x200000  # ~756 KB at entropy 7.99-8.00 -- encrypted or compressed,
                             # not analysable. A second small opaque region sits at 0x18040:0x19f00.
SIGNATURE_BLOCKS=0x1e7ef0:0x137410
SIGNATURE_MAGIC=0x84000060
ACC_STOPGO=yes
