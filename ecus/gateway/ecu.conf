# Audi B8/8R CAN Gateway -- J533 (VCDS address 19), part 8R0907468, SW 0060.
# Component GW-BEM 5CAN-M (LEAR Electronics). The car's own module reads 8R0 907 468 P /
# HW 8R0 907 468 D, component "GW-BEM 5CAN-M H11 0056"; this image is the newer SW 0060.
#
# CONTAINER + CIPHER (fully solved -- see docs/container_and_cipher.md):
#   Source is a standalone VAG "SGML Object File" (.sgo) with ONE flash block:
#     addr 0x8010, crypt=0x01, len 0xB7FF0 (declen==len, so length-preserving, not compressed).
#   crypt=0x01 for this LEAR gateway is NOT AES (simos-suite's heuristic mislabels it). It is a
#   multiplicative self-synchronising bit scrambler, LSB-first, polynomial x^15 + x^14 + 1:
#       descramble  p[t] = c[t] ^ c[t-14] ^ c[t-15]   (bit t, taps for t>=15)
#   Recovered with Berlekamp-Massey (linear complexity 15) + a GF(2) tap solve on the erased-flash
#   region; VALIDATED byte-exact (re-scrambling the plaintext reproduces the .sgo block) and the
#   erased region descrambles to clean 0x00. Regenerate the plaintext with:
#     python3 tools/sgo_gw_decode.py firmware/8R0907468___0060.sgo -o firmware/8R0907468_0060_plain.bin --verify

ECU_NAME=GW_8R0907468
FIRMWARE=firmware/8R0907468_0060_plain.bin
LOADBASE=0x8010          # the block's flash base address (image spans 0x8010..0xC0000)
IMAGE_HI=0xc0000

# ARCH: CANNOT be read from this block -- it holds NO program code. This container ships ONE
# block at data base 0x8010 and it is a RAW binary DATA partition (fixed-record tables + dense
# fields), not code, not compressed, not encrypted. Proven (docs/RE_findings.md,
# analysis/arch_sweep.md): 22-/24-/30-/74-byte fixed records (0x6F000 = 22B records, const field
# every 22 bytes); gzip shrinks it 17-56% (so NOT compressed); chi2~2500-27000 with thousands of
# 4-byte repeats (so NOT AES/encrypted); no ASCII; a 10-arch Ghidra sweep decodes nothing coherent
# (the "V850 1% invalid" fit is a permissive-decoder artifact -- the raw random blob scores the
# same). The self-sync scrambler (crypt=0x01) IS correctly cracked; the descramble is final.
# There is no vector table at 0x8010, so the executable code lives in a separate code partition
# (plausibly below 0x8010 / another SW block) NOT in this .sgo. PROCESSOR stays unset.
# PROCESSOR=  # do NOT set: this block is data, not code -- see analysis/arch_sweep.md

# Descrambled-block layout (VERIFIED by entropy + descramble + gzip/chi2 + arch sweep):
#   0x08010..~0x69000  raw DATA: fixed-record tables + dense high-entropy fields (NOT code)
#   ~0x69000..0x78000  more fixed-record tables (e.g. 0x6F000 = 22-byte records) + 0xFF pad
#   0x80000..0xC0000   erased flash -> clean 0x00 (256 KB)  [confirms the descramble]
# Whole block is data; there is no code here, so PROCESSOR stays unset and the pipeline skips.
CAL_LO=0x00008010
CAL_HI=0x000c0000
