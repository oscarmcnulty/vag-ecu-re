# AL551 (ZF 8HP TCU, Bosch/Renesas SH72519 SH-2A big-endian) -- Audi Q5 8R0927158AM SW1003.
# Full flash reassembled from the decoded FRF blocks (al551_codec.py) at their flash bases:
#   ASW 0x040000, blk2 0x006000, CBOOT 0x020000, CAL 0x180200. See analysis/can_arch.md.
ECU_NAME=AL551
FIRMWARE=firmware/8R_full_flash.bin
PROCESSOR=SuperH:BE:32:SH-2A
LOADBASE=0x0
IMAGE_HI=0x200000
EXPECT_SHA=30cfaf27b1caf3873d6f47d50d2413533d5578d23921f500934cfa14fd455525

# Code regions to sweep for orphan (disassembled, function-less) + bracketed (undefined) code.
# blk2 (0x6000), CBOOT (0x20000), ASW (0x40000-0x17FE00), boot2 tail (0x180280-0x190000).
CODE_RANGES=(0x006000:0x008000 0x020000:0x03fe00 0x040000:0x17fe00 0x180280:0x190000)

# Calibration window (self-describing axes + signed-int16 grids; CRC32 @0x180244).
CAL_LO=0x190000
CAL_HI=0x1ffd60

# SH-2A has no TriCore base-register / cal-base concept, so BASEREGS stays empty (step 3 skips).

# Renesas flash erases to 0xFF (not 0x00 like Infineon), so count 0xFF fill as erased in the
# coverage report -- otherwise ~380 KB of erased padding is miscounted as unaccounted code.
COV_FLAGS="--erased-ff --blocks"
A2L=maps/al551.a2l

# SH-2A RAM + peripheral blocks (raw BinaryLoader import lacks them). Enables RAM-read mapping
# and the descriptor pointer-table resolution below.
MEMMAP=(--uninit=0xfff80000:0x40000:RAM:rw --uninit=0xfffe0000:0x20000:PERIPH:rwv)

# Boot-installed RAM descriptor pointer tables, resolved AUTHORITATIVELY by EMULATING the init
# stubs (analysis/gen_ram_bases.sh -> InitEmu.java). Static deref was wrong for 72/154 slots.
# Surgically initializes ONLY those table regions so RAM-base indirection resolves while
# mutable scalars stay symbolic. CSV regenerated by analysis/gen_ram_bases.sh (emulator).
RAM_DATA_IMAGE=analysis/ram_bases.csv
