# Audi B8/8R EPS rack -- Steering Assist J500 (VCDS addr 44), part 8R0909144F, SW 0507,
# component RCEPS, ASAM EV_RCEPSAU48X. The TORQUE actuator (power-assist rack) and the
# module that reads/executes an external lane-keep (HCA-style) torque request. Distinct
# from the V850 Dynamic Steering ANGLE actuator in ecus/dynsteer.
#
# Image = ODX block DB_2 (id 0x50, the ASW+CAL) from FL_8R0909144F_0507_BP.frf, decrypted
# with VW_Flash frf.decryptfrf then core/odx/odx_extract.py. Plaintext (EPS_CORE/EPS_AUDI C
# sources incl. lkf_container.c visible as strings).
#
# ARCH: Renesas/NEC V850, little-endian, base 0x00000000 -- SAME core family as the
# Dynamic Steering unit (both ZF/Renesas). ESTABLISHED, not guessed: a V850 linear sweep of
# the code region is 0% invalid with strong call-target concentration (one function called
# 79x, 52 targets reused >=2x over a single 64KB window) -- real code. TriCore was REJECTED
# (0 functions; the 0x80xxxxxx "self-pointers" were a cal-fill artifact of 0x8007e007), as
# were ARM (decodes but zero call reuse) and PowerPC.

ECU_NAME=EPS_8R0909144F
FIRMWARE=firmware/8R0909144F_0507.bin
LOADBASE=0x0
PROCESSOR=V850:LE:32:default
IMAGE_HI=0x86000

# CONST-DATA LOAD OFFSET (+0x12000). Code addresses are 1:1 with file offsets at LOADBASE=0x0,
# but the firmware's baked-in *const-data* absolute pointers are 0x12000 higher than their file
# offset (DB_2/ASW+CAL is flashed at ECU base ~0x12000; we load the extracted block at 0x0).
# So to read a const table the decompile references at address X, read file offset X-0x12000.
# Verified: CRC8H2F table code-ref 0x12474 -> file 0x474 (validates live bus 40/40); AFCAN
# mailbox ID table 0x125c0 -> file 0x5c0. LOADBASE kept at 0x0 to keep symbols_merged.csv stable
# (re-basing to 0x12000 would resolve data refs automatically but shift every symbol). See
# docs/RE_findings.md "Const-data load offset" and docs/can_tx.md.

# V850 base registers (recovered from crt0 @0x259ca) -- step 3 sets these as context +
# re-analyzes, folding every gp/tp-relative cal & RAM read to an absolute address. Without
# them the whole corpus decompiles as unaff_gp / *(gp+off). (SetBaseRegs.java is generic.)
BASEREGS=(gp=0xFFFF0000 tp=0x0001A238)

# On-chip RAM / peripheral windows (V850 family, as in ecus/dynsteer).
MEMMAP=(--uninit=0xfffe0000:0x0001f000:IRAM:rw
        --uninit=0xfff00000:0x000ff000:PPA_IO:rwv
        --uninit=0xfffff000:0x00001000:SFR:rwv)

# First pass: sweep the whole image for code (ASW code + interspersed cal). The middle
# 0x48000..0x78000 is a fill pattern (0x8007e007) = reserved/erased, skipped as sparse.
CODE_RANGES=(0x00006000:0x00040000 0x00078000:0x00086000)
# Cal + a 208KB 0x8007e007 fill (0x45678..0x78000) -> mark as DATA so import's
# auto-analysis fall-through does not swallow it as one bogus 208KB function.
CAL_LO=0x00040000
CAL_HI=0x00078000

RESOLVE_DISPATCH=analysis/dispatch_resolved.csv

# --- V850 base registers (recovered from crt0 @0x259ca; set with ghidra_scripts/SetV850Bases.java) ---
# gp = 0xFFFF0000  (movhi -1,r0,gp ; movea 0,gp,gp)   -> small-data / RAM base
# tp = 0x0001A238  (movhi 2,r0,tp  ; movea -0x5dc8,tp,tp) -> flash rodata/const base
# Setting these as program-wide register values folds every gp/tp-relative cal & RAM read to an
# absolute address (0 unaff_gp across the corpus). The reset vector jr @0x0 -> crt0 @0x259ca.
# Re-apply after any fresh import:  analyzeHeadless <proj> -process <bin> -noanalysis \
#     -scriptPath ghidra_scripts -postScript SetV850Bases.java   (then re-run DecompileAll.java)
V850_GP=0xFFFF0000
V850_TP=0x0001A238
V850_RESET=0x000259ca
